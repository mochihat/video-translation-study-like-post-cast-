<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lồng tiếng Việt cho YouTube</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#d93025; --ok:#188038; --warn:#b06000; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --text:#e8eaef; --muted:#9aa1b0; --line:#2d313b; --accent:#ff6b5e; --ok:#5bd38a; --warn:#f0b450; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  a { color:var(--accent); text-decoration:none; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h1 a { color:inherit; }
  h2 { font-size:17px; margin:0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .muted { color: var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  label.check { display:flex; gap:8px; align-items:center; color:var(--text); font-size:15px; margin-top:12px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  input[type=range] { padding:0; }
  input[type=checkbox] { width:auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-top:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:6px 12px; font-weight:400; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .msg { margin-left:12px; }
  .err { color:var(--accent); }
  .banner { display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .lib { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; color:var(--text); display:block; }
  .tile:hover { border-color: var(--muted); }
  .cover { aspect-ratio:16/9; background:var(--line) center/cover no-repeat; position:relative; }
  .cover .dur { position:absolute; right:6px; bottom:6px; background:#000c; color:#fff; font-size:12px; padding:1px 6px; border-radius:4px; }
  .cover .stack { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; background:#0005; color:#fff; }
  .tile .info { padding:8px 10px 10px; }
  .tile .t { font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .badge { font-size:12px; padding:1px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .badge.done { color:var(--ok); border-color:var(--ok); }
  .badge.error { color:var(--accent); border-color:var(--accent); }
  .badge.running { color:var(--warn); border-color:var(--warn); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); transition: width .3s; }
  .bar.ok > div { background:var(--ok); }
  .steps { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  .step { display:flex; align-items:center; gap:10px; color:var(--muted); }
  .step.active { color:var(--text); font-weight:600; }
  .step.ok { color:var(--ok); }
  .step .bar { flex:1; max-width:240px; }
  video { width:100%; border-radius:8px; background:#000; }
  .links a { margin-right:16px; }
  pre { background:var(--bg); padding:10px; border-radius:8px; max-height:180px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { border-top:1px solid var(--line); padding:6px 8px; vertical-align:top; }
  td.time { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; cursor:pointer; }
  tr.now td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .seg-wrap { max-height:360px; overflow:auto; margin-top:12px; }
  .watch { display:grid; grid-template-columns: 1fr 300px; gap:16px; align-items:start; }
  @media (max-width: 860px) { .watch { grid-template-columns: 1fr; } }
  .plist { max-height:560px; overflow:auto; }
  .pitem { display:flex; gap:8px; padding:6px; border-radius:8px; color:var(--text); align-items:center; }
  .pitem:hover { background:var(--bg); }
  .pitem.cur { background:var(--bg); outline:1px solid var(--line); }
  .pitem .cover { width:96px; flex:none; border-radius:4px; }
  .pitem .t { font-size:13px; flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pitem .n { color:var(--muted); font-size:12px; width:20px; text-align:right; flex:none; }
  .back { display:inline-block; margin-bottom:12px; }
  .opt { display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; cursor:pointer; }
  .opt.sel { border-color:var(--accent); }
  .opt.off { opacity:.7; }
  .opt input { margin-top:4px; }
  .opt .bar { margin-top:6px; max-width:320px; }
  #remoteCard svg { width:100%; height:auto; display:block; }
  .noplay { aspect-ratio:16/9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px; border-radius:8px; background:var(--bg); border:1px dashed var(--line); }
</style>
</head>
<body>
<main>
  <div class="row"><h1><a href="#">🎬 Lồng tiếng Việt cho YouTube</a></h1>
    <span><a href="#settings" class="muted" id="storageLink">💾 Nơi lưu video</a>
      <button class="ghost" id="ejectBtn" hidden title="Dừng ghi vào ổ và tháo ra an toàn">⏏ Tháo ổ an toàn</button></span></div>
  <p class="sub">Dán link video hoặc playlist tiếng Trung / tiếng Anh — hệ thống nghe, dịch và đọc lại bằng tiếng Việt.</p>
  <div id="conn" class="banner" hidden><span>⚠️</span><span style="flex:1">Mất kết nối tới máy chủ — đang tự kết nối lại…</span>
    <button class="ghost" onclick="location.reload()">Tải lại trang</button></div>
  <div id="banner"></div>
  <div id="view"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS = { queued:"Đang chờ", running:"Đang xử lý", done:"Xong", error:"Lỗi" };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} },
                del(k) { try { localStorage.removeItem(k); } catch {} } };
let STEPS = [], LIB = { jobs:[], playlists:[] }, renderedKey = null;

function fmt(t) {
  t = Math.floor(t || 0);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}
const coverUrl = j => j.status === "done" || j.video_id ? `/files/${j.id}/cover.jpg` : "";
// ---------- Kết nối tới máy chủ: mất kết nối thì báo và tự thử lại ----------
let online = true, reconnected = false;
function setOnline(ok) {
  if (ok === online) return;
  online = ok;
  $("#conn").hidden = ok;
  if (ok) reconnected = true;  // lần làm mới kế tiếp sẽ vẽ lại trang đang xem
}
const offlineError = () => Object.assign(new Error("Mất kết nối tới máy chủ"), { offline: true });
const api = async (url, opts) => {
  let r;
  try { r = await fetch(url, opts); } catch { setOnline(false); throw offlineError(); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status >= 500 && !j.error) { setOnline(false); throw offlineError(); }
  setOnline(true);
  if (!r.ok) throw Object.assign(new Error(j.error || "Lỗi " + r.status), { status: r.status });
  return j;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
// thao tác (bấm nút) bị lỗi thì hiện thông báo thay vì im lặng
window.addEventListener("unhandledrejection", e => { if (!e.reason?.offline) flash("Lỗi: " + (e.reason?.message || e.reason)); });

// ---------- Trang chủ: form + thư viện ----------
function formHtml() {
  return `<div class="card">
    <label for="url">Link YouTube (video hoặc playlist)</label>
    <input id="url" placeholder="https://www.youtube.com/watch?v=...  hoặc  https://www.youtube.com/playlist?list=...">
    <label class="check" id="plWrap" hidden><input type="checkbox" id="pl" checked> Dịch toàn bộ playlist</label>
    <div class="grid">
      <div><label for="language">Ngôn ngữ gốc</label>
        <select id="language"><option value="auto">Tự nhận diện</option><option value="zh">Tiếng Trung</option><option value="en">Tiếng Anh</option></select></div>
      <div><label for="voice">Giọng đọc</label>
        <select id="voice"><option value="female">Nữ – Hoài My</option><option value="male">Nam – Nam Minh</option></select></div>
      <div><label for="model">Chất lượng nhận dạng</label>
        <select id="model"><option value="small">Nhanh (small)</option><option value="large-v3-turbo" selected>Tốt (large-v3-turbo)</option><option value="large-v3">Tốt nhất, chậm (large-v3)</option></select></div>
      <div><label for="translator">Công cụ dịch</label>
        <select id="translator"><option value="offline">Offline trên máy (NLLB)</option><option value="google">Google Dịch (cần mạng)</option></select></div>
      <div><label for="bg">Âm lượng tiếng gốc: <span id="bgv">25%</span></label>
        <input id="bg" type="range" min="0" max="100" value="25"></div>
      <div><label for="cookies" title="Bật khi YouTube báo 'Sign in to confirm you're not a bot'">Đăng nhập YouTube qua</label>
        <select id="cookies"><option value="none">Không dùng</option><option value="firefox">Firefox (cần đăng nhập YouTube trên Firefox)</option><option value="chrome">Chrome</option></select></div>
    </div>
    <div style="margin-top:14px"><button id="go">Bắt đầu lồng tiếng</button><span id="msg" class="msg"></span></div>
  </div>
  <div id="lib"></div>`;
}

function bindForm() {
  // nhớ lựa chọn lần trước
  for (const id of ["language","voice","model","translator","bg","cookies"]) {
    const v = store.get("opt:" + id); if (v !== null) $("#" + id).value = v;
    $("#" + id).addEventListener("change", e => store.set("opt:" + id, e.target.value));
  }
  $("#bgv").textContent = $("#bg").value + "%";
  $("#bg").oninput = e => $("#bgv").textContent = e.target.value + "%";
  $("#url").oninput = e => $("#plWrap").hidden = !e.target.value.includes("list=");
  $("#go").onclick = async () => {
    const msg = $("#msg"), btn = $("#go");
    const isPl = $("#url").value.includes("list=") && $("#pl").checked;
    msg.className = "msg muted"; msg.textContent = isPl ? "Đang đọc danh sách playlist..." : "";
    btn.disabled = true;
    try {
      const r = await api("/api/jobs", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
        url: $("#url").value, playlist: isPl, language: $("#language").value, voice: $("#voice").value,
        model: $("#model").value, translator: $("#translator").value, bg_volume: $("#bg").value / 100,
        cookies: $("#cookies").value }) });
      $("#url").value = ""; $("#plWrap").hidden = true;
      if (r.playlist) {
        location.hash = "p=" + r.playlist.id;
        if (r.updated) setTimeout(() => flash(r.added ? `Đã cập nhật playlist đã có: thêm ${r.added} video vào hàng đợi.` : "Playlist này đã có đủ video."), 300);
      } else {
        location.hash = "v=" + r.job.id;
        if (r.existing) setTimeout(() => flash("Video này đã được lồng tiếng trước đó — mở lại bản đã lưu."), 300);
      }
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    btn.disabled = false;
  };
}

function flash(text) {
  const el = document.createElement("div");
  el.className = "banner"; el.textContent = text;
  $("#view").prepend(el); setTimeout(() => el.remove(), 6000);
}

function tile(j) {
  const bar = j.status === "running" ? `<div class="bar"><div style="width:${progressOf(j)*100}%"></div></div>` : "";
  return `<a class="tile" href="#v=${j.id}">
    <div class="cover" style="background-image:url('${coverUrl(j)}')">${j.duration ? `<span class="dur">${fmt(j.duration)}</span>` : ""}</div>
    ${bar}
    <div class="info"><div class="t">${esc(j.title)}</div>
      <div class="row" style="margin-top:6px"><span class="badge ${j.status}">${STATUS[j.status]}</span>${
        j.status === "done" && !j.video_ok ? `<span class="muted" title="Video nằm trên ${esc(j.video_place)}">🔌 Cần cắm ổ</span>` : resumeLabel(j)}</div></div></a>`;
}

function resumeLabel(j) {
  const p = +store.get("pos:" + j.id);
  return p > 5 ? `<span class="muted">Đã xem ${fmt(p)}</span>` : "";
}

function progressOf(j) {
  const i = STEPS.findIndex(s => s.id === j.step);
  return i < 0 ? 0 : (i + (j.progress || 0)) / STEPS.length;
}

function renderLibrary() {
  const el = $("#lib"); if (!el) return;
  const inPl = new Set(LIB.playlists.flatMap(p => p.job_ids));
  const singles = LIB.jobs.filter(j => !inPl.has(j.id));
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  let html = "";
  if (LIB.playlists.length) {
    html += `<div class="card"><h2>Playlist</h2><div class="lib">${LIB.playlists.map(p => {
      const first = byId[p.job_ids.find(id => byId[id]?.status === "done")] || byId[p.job_ids[0]] || {};
      return `<a class="tile" href="#p=${p.id}">
        <div class="cover" style="background-image:url('${first.id ? coverUrl(first) : ""}')"><span class="stack">☰ ${p.total}</span></div>
        <div class="bar ok"><div style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div>
        <div class="info"><div class="t">${esc(p.title)}</div>
          <div class="muted" style="margin-top:6px">${p.done}/${p.total} video xong${p.failed ? ` · <span class="err">${p.failed} lỗi</span>` : ""}</div></div></a>`;
    }).join("")}</div></div>`;
  }
  html += `<div class="card"><h2>Video</h2>${singles.length ? `<div class="lib">${singles.map(tile).join("")}</div>` : '<span class="muted">Chưa có video nào.</span>'}</div>`;
  el.innerHTML = html;
}

function renderBanner() {
  if (LIB.storage) $("#storageLink").textContent = "💾 Lưu tại: " + LIB.storage;
  const eb = $("#ejectBtn"), drive = (LIB.ejectable || [])[0];
  if (!eb.disabled) {
    eb.hidden = !drive;
    if (drive) { eb.textContent = `⏏ Tháo ${drive.name} an toàn`; eb.dataset.loc = drive.id; }
  }
  const ejected = (LIB.ejecting || []).map(d => `<div class="banner" style="border-left-color:var(--ok)"><span>✅</span>
      <span style="flex:1"><b>Đã tháo ${esc(d.name)} an toàn — giờ có thể rút ổ ra.</b>
        <br><span class="muted">Cắm ổ lại là dùng tiếp bình thường.</span></span>
      <button class="ghost resume-drive" data-loc="${esc(d.id)}">Dùng lại ổ ngay</button></div>`).join("");
  const cur = LIB.jobs.find(j => j.id === LIB.current);
  $("#banner").innerHTML = ejected + (cur ? `<div class="banner">
      <span>⏳</span>
      <span style="flex:1">Đang xử lý: <a href="#v=${cur.id}">${esc(cur.title)}</a>
      ${LIB.queued ? ` — còn <b>${LIB.queued}</b> video chờ` : ""}
      ${LIB.paused_until ? `<br><span class="err">${esc(LIB.pause_reason)} — tự thử lại lúc ${new Date(LIB.paused_until * 1000).toLocaleTimeString("vi-VN")}.
        ${LIB.pause_reason?.includes("YouTube") ? 'Nếu bị chặn lâu, hãy đăng nhập YouTube trên Firefox rồi chọn "Đăng nhập YouTube qua: Firefox".' : ""}</span>` : ""}
      <br><span class="muted">Máy sẽ không tự ngủ cho tới khi xong. Có thể đóng trình duyệt, nhưng đừng tắt máy.</span></span>
    </div>` : "");
  document.querySelectorAll(".resume-drive").forEach(b => b.onclick = async () => {
    await api("/api/storage/resume", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ location: b.dataset.loc }) });
    await refreshLib();
  });
}

// ---------- Trang playlist ----------
function renderPlaylist(id) {
  const p = LIB.playlists.find(p => p.id === id);
  if (!p) { $("#view").innerHTML = '<a class="back" href="#">← Thư viện</a><p>Không tìm thấy playlist.</p>'; return; }
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  const emptyTile = (e, i) => `<div class="tile" style="opacity:.75;cursor:default">
    <div class="cover" style="background-image:url('${e.video_id ? `https://i.ytimg.com/vi/${e.video_id}/mqdefault.jpg` : ""}');filter:grayscale(1)"></div>
    <div class="info"><div class="t">${esc(e.title || "Video đã xoá")}</div>
      <div class="row" style="margin-top:6px"><span class="badge">Đã xoá</span>
        <button class="ghost redo-slot" data-i="${i}">Lồng tiếng lại</button></div></div></div>`;
  $("#view").innerHTML = `<a class="back" href="#">← Thư viện</a>
    <div class="card"><div class="row"><h2 style="margin:0">${esc(p.title)}</h2>
      <span><a class="muted" href="${esc(p.url)}" target="_blank">Mở trên YouTube</a>
        <button class="ghost" id="syncPl" title="Thêm video mới, lồng tiếng lại video đã xoá và thử lại video lỗi">Cập nhật từ YouTube</button>
        <button class="ghost" id="delPl">Xoá playlist</button></span></div>
      <p class="muted">${p.done}/${p.total} video đã lồng tiếng${p.failed ? ` · <span class="err">${p.failed} lỗi</span>` : ""}${p.missing ? ` · ${p.missing} đã xoá` : ""}
        ${p.failed ? ' <button class="ghost" id="retryPl">Thử lại video lỗi</button>' : ""}</p>
      <div class="bar ok"><div style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div></div>
    <div class="lib">${p.entries.map((e, i) => byId[e.job_id] ? tile(byId[e.job_id]) : emptyTile(e, i)).join("")}</div>`;
  $("#delPl").onclick = async () => {
    if (!confirm("Xoá playlist này và toàn bộ video đã lồng tiếng trong đó?")) return;
    await api("/api/playlists/" + id, { method:"DELETE" });
    location.hash = "";
  };
  $("#syncPl").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Đang đọc playlist...";
    try {
      const r = await api(`/api/playlists/${id}/sync`, { method:"POST" });
      flash(r.added ? `Đã thêm ${r.added} video vào hàng đợi.` : "Playlist đã đủ video, không có gì mới.");
    } finally { await refreshLib(); renderPlaylist(id); }
  };
  if ($("#retryPl")) $("#retryPl").onclick = async () => {
    const r = await api(`/api/playlists/${id}/retry-failed`, { method:"POST" });
    flash(`Đã đưa ${r.count} video lỗi vào hàng đợi.`);
    await refreshLib(); renderPlaylist(id);
  };
  document.querySelectorAll(".redo-slot").forEach(b => b.onclick = async () => {
    b.disabled = true;
    await api(`/api/playlists/${id}/slots/${b.dataset.i}`, { method:"POST" });
    await refreshLib(); renderPlaylist(id);
  });
}

// ---------- Trang xem / tiến độ một video ----------
async function renderVideo(id) {
  let j;
  try { j = await api("/api/jobs/" + id); } catch (e) {
    // mất kết nối thì giữ nguyên trang, tự thử lại ở lần làm mới sau
    if (!e.offline) $("#view").innerHTML = '<a class="back" href="#">← Thư viện</a><p>Không tìm thấy video (có thể đã bị xoá).</p>';
    return;
  }
  if (location.hash !== "#v=" + id) return;
  const pl = LIB.playlists.find(p => p.job_ids.includes(id));
  const back = pl ? `<a class="back" href="#p=${pl.id}">← ${esc(pl.title)}</a>` : '<a class="back" href="#">← Thư viện</a>';
  const key = [id, j.status, j.video_ok, j.local_copy].join(":");

  if (j.status === "done") {
    if (renderedKey === key) { renderSide(pl, id); return; }
    renderedKey = key;
    $("#view").innerHTML = `${back}
      <div class="watch"><div>
        <div class="card">
          ${j.video_ok
            ? `<video id="player" controls autoplay src="/files/${id}/dubbed.mp4"><track kind="subtitles" srclang="vi" label="Tiếng Việt" default></video>`
            : `<div class="noplay"><div style="font-size:36px">🔌</div>
                 <b>Video nằm trên ${esc(j.video_place)}</b>
                 <span class="muted">Cắm ổ vào máy để xem — trang sẽ tự mở video khi nhận ổ. Lời thoại song ngữ bên dưới vẫn đọc được.</span></div>`}
          <div class="row" style="margin-top:10px"><h2 style="margin:0">${esc(j.title)}</h2>
            <span><button class="ghost" id="redo">Làm lại</button> <button class="ghost" id="del">Xoá</button></span></div>
          <p class="muted" style="margin:6px 0 0">💾 Lưu tại: ${esc(j.video_place)}${j.local_copy ? " · có bản trên laptop" : ""}
            ${j.video_at && j.video_at !== "local" && (j.video_ok || j.local_copy)
              ? ` <button class="ghost" id="keep">${j.local_copy ? "Bỏ bản trên laptop" : "Giữ trên laptop (xem khi không cắm ổ)"}</button>` : ""}</p>
          <p class="links" style="margin-bottom:0">
            ${j.video_ok ? `<a href="/files/${id}/dubbed.mp4?dl=1">⬇ Video lồng tiếng</a>` : ""}
            <a href="/files/${id}/vi.srt?dl=1">⬇ Phụ đề Việt</a>
            <a href="/files/${id}/original.srt?dl=1">⬇ Phụ đề gốc</a>
            <a href="${esc(j.url)}" target="_blank">↗ YouTube</a></p>
        </div>
        <div class="card"><h2>Lời thoại song ngữ</h2><div class="seg-wrap" id="segs"><table>${(j.segments || []).map((s, i) => `
          <tr data-i="${i}"><td class="time" data-t="${s.start}">${fmt(s.start)}</td><td>${esc(s.text)}</td><td>${esc(s.vi)}</td></tr>`).join("")}
        </table></div></div>
      </div><div id="side"></div></div>`;
    if (j.video_ok) setupPlayer(j, pl);
    renderSide(pl, id);
    if ($("#keep")) $("#keep").onclick = async e => {
      e.target.disabled = true; e.target.textContent = j.local_copy ? "Đang xoá..." : "Đang chép về laptop...";
      try { await api(`/api/jobs/${id}/keep-local`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ keep: !j.local_copy }) }); }
      finally { renderedKey = null; renderVideo(id); }
    };
    $("#del").onclick = async () => {
      if (!confirm("Xoá video này?")) return;
      await api("/api/jobs/" + id, { method:"DELETE" });
      location.hash = pl ? "p=" + pl.id : "";
    };
    $("#redo").onclick = async () => {
      if (!confirm("Lồng tiếng lại video này với cài đặt hiện tại trên trang chủ? (bản cũ vẫn được giữ)")) return;
      const r = await api("/api/jobs", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ url: j.url, force: true, voice: j.voice, language: j.language, model: j.model, translator: j.translator, bg_volume: j.bg_volume, cookies: j.cookies }) });
      location.hash = "v=" + r.job.id;
    };
    return;
  }

  renderedKey = key;
  const idx = STEPS.findIndex(s => s.id === j.step);
  $("#view").innerHTML = `${back}<div class="card">
    <div class="row"><h2 style="margin:0">${esc(j.title)}</h2><span class="badge ${j.status}">${STATUS[j.status]}</span></div>
    ${j.status === "queued" ? `<p class="muted">Đang chờ tới lượt — các video được xử lý lần lượt từng cái.</p>` : ""}
    <div class="steps">${STEPS.map((s, i) => {
      const cls = j.status === "error" && i === idx ? "" : i < idx ? "ok" : i === idx ? "active" : "";
      const mark = i < idx ? "✓" : i === idx ? (j.status === "error" ? "✗" : "●") : "○";
      const bar = i === idx && j.status === "running" ? `<div class="bar"><div style="width:${j.progress*100}%"></div></div>` : "";
      return `<div class="step ${cls}"><span>${mark}</span><span>${s.name}</span>${bar}</div>`;
    }).join("")}</div>
    ${j.error ? `<p class="err">Lỗi: ${esc(j.error)}</p>` : ""}
    <pre>${esc(j.logs.join("\n")) || "Đang chờ..."}</pre>
    ${j.status === "error" ? '<button id="retry">Thử lại</button> ' : ""}
    ${j.status !== "running" ? '<button class="ghost" id="del">' + (j.status === "queued" ? "Huỷ" : "Xoá") + '</button>' : ""}
  </div>`;
  if ($("#retry")) $("#retry").onclick = async () => { await api(`/api/jobs/${id}/retry`, { method:"POST" }); renderedKey = null; };
  if ($("#del")) $("#del").onclick = async () => { await api("/api/jobs/" + id, { method:"DELETE" }); location.hash = pl ? "p=" + pl.id : ""; };
}

function renderSide(pl, id) {
  const side = $("#side"); if (!side) return;
  if (!pl) { side.remove(); $(".watch").style.gridTemplateColumns = "1fr"; return; }
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  side.innerHTML = `<div class="card"><h2>${esc(pl.title)}</h2><p class="muted">${pl.done}/${pl.total} video xong</p>
    <div class="plist">${pl.entries.map((e, n) => { const jid = e.job_id, j = byId[jid];
      if (!j) return `<div class="pitem" style="opacity:.6"><span class="n">${n + 1}</span><div class="t">${esc(e.title || "")}<br><span class="badge">Đã xoá</span></div></div>`;
      return `<a class="pitem ${jid === id ? "cur" : ""}" href="#v=${jid}"><span class="n">${n + 1}</span>
        <div class="cover" style="background-image:url('${coverUrl(j)}')"></div>
        <div class="t">${esc(j.title)}<br><span class="badge ${j.status}">${STATUS[j.status]}</span></div></a>`; }).join("")}</div></div>`;
  side.querySelector(".cur")?.scrollIntoView({ block:"nearest" });
}

function setupPlayer(j, pl) {
  const v = $("#player"), id = j.id;
  // trình duyệt chỉ đọc phụ đề dạng VTT
  (async function loadTrack(tries = 0) {
    try {
      const r = await fetch(`/files/${id}/vi.srt`);
      if (!r.ok) throw 0;
      const srt = await r.text();
      v.querySelector("track").src = URL.createObjectURL(new Blob(["WEBVTT\n\n" + srt.replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2")], { type:"text/vtt" }));
    } catch { if (tries < 20 && document.body.contains(v)) setTimeout(() => loadTrack(tries + 1), 3000); }
  })();
  const saved = +store.get("pos:" + id);
  v.addEventListener("loadedmetadata", () => { if (saved > 5 && saved < v.duration - 5) v.currentTime = saved; }, { once:true });

  // video lỗi hoặc đứng hình quá lâu (mạng chập chờn, máy chủ khởi động lại) -> tự tải lại tại đúng chỗ đang xem
  let retries = 0, stallTimer = null, lastGood = 0;
  const note = document.createElement("p");
  note.className = "muted"; note.hidden = true;
  v.after(note);
  const reloadVideo = reason => {
    clearTimeout(stallTimer);
    if (!document.body.contains(v)) return;
    const t = v.currentTime || lastGood || saved || 0, wasPaused = v.paused && retries === 0 && reason === "stall";
    const wait = Math.min(2000 * 2 ** retries++, 30000);
    note.hidden = false; note.textContent = `⚠️ ${reason === "stall" ? "Video bị đứng" : "Lỗi tải video"} — tự tải lại sau ${wait / 1000} giây…`;
    setTimeout(() => {
      if (!document.body.contains(v)) return;
      v.src = `/files/${id}/dubbed.mp4?r=${Date.now()}`;
      v.addEventListener("loadedmetadata", () => { v.currentTime = t; if (!wasPaused) v.play().catch(() => {}); }, { once:true });
      v.load();
    }, wait);
  };
  v.addEventListener("error", () => reloadVideo("error"));
  v.addEventListener("waiting", () => { clearTimeout(stallTimer); stallTimer = setTimeout(() => !v.paused && reloadVideo("stall"), 15000); });
  v.addEventListener("playing", () => { clearTimeout(stallTimer); retries = 0; note.hidden = true; });
  v.addEventListener("pause", () => clearTimeout(stallTimer));
  v.addEventListener("timeupdate", () => { if (v.currentTime > 0) lastGood = v.currentTime; });
  let last = 0, curRow = null;
  v.addEventListener("timeupdate", () => {
    if (Math.abs(v.currentTime - last) > 3) { last = v.currentTime; store.set("pos:" + id, v.currentTime); }
    const segs = j.segments || [];
    let i = segs.findIndex((s, k) => v.currentTime >= s.start && v.currentTime < (segs[k + 1]?.start ?? Infinity));
    const row = document.querySelector(`#segs tr[data-i="${i}"]`);
    if (row !== curRow) { curRow?.classList.remove("now"); row?.classList.add("now"); curRow = row;
      if (row) { const w = $("#segs"); w.scrollTop = row.offsetTop - w.clientHeight / 3; } }
  });
  v.addEventListener("ended", () => {
    store.del("pos:" + id);
    if (!pl) return;
    const byId = Object.fromEntries(LIB.jobs.map(x => [x.id, x]));
    const next = pl.job_ids.slice(pl.job_ids.indexOf(id) + 1).find(x => byId[x]?.status === "done");
    if (next) location.hash = "v=" + next;  // tự chuyển sang video tiếp theo
  });
  document.querySelectorAll("#segs td.time").forEach(td => td.onclick = () => { v.currentTime = +td.dataset.t; v.play(); });
}

// ---------- Trang chọn nơi lưu video ----------
const gb = b => b == null ? "?" : (b / 1024 ** 3).toFixed(b < 10 * 1024 ** 3 ? 1 : 0) + " GB";

async function renderSettings(full) {
  let s;
  try { s = await api("/api/storage"); } catch { return; }
  if (location.hash !== "#settings") return;
  const mv = s.moving;
  const moveHtml = mv.running
    ? `<p>⏳ Đang chuyển video ${mv.done + mv.skipped + 1}/${mv.total}: ${esc(mv.title || "")}</p>
       <div class="bar ok"><div style="width:${mv.total ? (mv.done + mv.skipped) / mv.total * 100 : 0}%"></div></div>`
    : mv.total ? `<p class="${mv.error ? "err" : "muted"}">${mv.error ? "Lỗi khi chuyển: " + esc(mv.error)
        : `Đã chuyển ${mv.done} video${mv.skipped ? `, bỏ qua ${mv.skipped} video (ổ cũ chưa cắm)` : ""}.`}</p>` : "";
  if (!full) { const m = $("#moveState"); if (m) m.innerHTML = moveHtml; return; }

  $("#view").innerHTML = `<a class="back" href="#">← Thư viện</a>
    <div class="card"><h2>💾 Nơi lưu video</h2>
      <p class="muted">Video lồng tiếng (file nặng) và file tạm khi xử lý sẽ được lưu ở nơi bạn chọn.
        Tên video, ảnh bìa, phụ đề và lời thoại song ngữ luôn nằm trên laptop, nên rút ổ ra vẫn xem được thư viện.</p>
      ${s.options.map(o => {
        const used = o.size && o.free != null ? 1 - o.free / o.size : null;
        return `<label class="opt ${o.id === s.current ? "sel" : ""} ${o.ok ? "" : "off"}">
          <input type="radio" name="loc" value="${esc(o.id)}" ${o.id === s.current ? "checked" : ""} ${o.ok || o.id === s.current ? "" : "disabled"}>
          <div style="flex:1">
            <b>${o.external ? "🔌" : "💻"} ${esc(o.label)}</b> ${o.id === s.current ? '<span class="badge done">Đang dùng</span>' : ""}
            <div class="muted">${esc(o.path)}${o.fstype ? " · " + esc(o.fstype.toUpperCase()) : ""}
              ${o.size ? ` · trống ${gb(o.free)} / ${gb(o.size)}` : ""}</div>
            ${used != null ? `<div class="bar ${used > .9 ? "" : "ok"}"><div style="width:${used * 100}%"></div></div>` : ""}
            ${o.reason ? `<div class="err" style="font-size:13px;margin-top:4px">${esc(o.reason)}</div>` : ""}
          </div></label>`;
      }).join("")}
      ${s.pending_move ? `<label class="check"><input type="checkbox" id="moveOld" checked>
        Chuyển ${s.pending_move} video đã có sang nơi lưu mới (giải phóng chỗ ở nơi cũ)</label>` : ""}
      <div style="margin-top:14px"><button id="saveLoc">Lưu lựa chọn</button> <button class="ghost" id="rescan">Quét lại ổ</button>
        <span id="locMsg" class="msg"></span></div>
      <div id="moveState" style="margin-top:12px">${moveHtml}</div>
    </div>
    <div class="card" id="remoteCard"></div>`;
  renderRemote();
  document.querySelectorAll("input[name=loc]").forEach(r => r.onchange = () => {
    document.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.contains(r) && r.checked));
  });
  $("#rescan").onclick = () => renderSettings(true);
  $("#saveLoc").onclick = async () => {
    const loc = document.querySelector("input[name=loc]:checked")?.value, msg = $("#locMsg");
    msg.className = "msg muted"; msg.textContent = "Đang kiểm tra ổ...";
    try {
      await api("/api/storage", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ location: loc, move: !!$("#moveOld")?.checked }) });
      await renderSettings(true);
      flash("Đã lưu. Video mới sẽ được lưu ở nơi bạn chọn.");
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
  };
}

async function renderRemote(data) {
  const el = $("#remoteCard"); if (!el) return;
  let r = data;
  if (!r) { try { r = await api("/api/remote"); } catch { return; } }
  const post = async body => renderRemote(await api("/api/remote", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }));
  el.innerHTML = `<div class="row"><h2 style="margin:0">📱 Xem trên điện thoại</h2>
      <button ${r.enabled ? 'class="ghost"' : ""} id="remoteToggle">${r.enabled ? "Tắt" : "Bật"}</button></div>
    <p class="muted">Xem video trên điện thoại hoặc máy khác <b>dùng cùng Wi-Fi</b>${r.wifi ? ` (“${esc(r.wifi)}”)` : ""} với laptop.
      Laptop phải đang bật, không ngủ và cắm ổ chứa video.</p>
    ${!r.enabled ? "" : r.urls.length ? `
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
        <div style="background:#fff;border-radius:10px;padding:6px;width:190px;line-height:0">${r.urls[0].qr}</div>
        <div style="flex:1;min-width:220px">
          <p style="margin:0 0 6px"><b>Cách 1:</b> mở Camera trên điện thoại, quét mã QR bên cạnh.</p>
          <p style="margin:0 0 6px"><b>Cách 2:</b> mở trình duyệt điện thoại, gõ
            ${r.urls.map(u => `<br><code style="font-size:17px">${esc(u.url)}</code>`).join("")}
            <br>rồi nhập mã PIN: <b style="font-size:22px;letter-spacing:4px">${esc(r.pin)}</b></p>
          <p class="muted" style="margin:0">Mỗi điện thoại chỉ cần nhập PIN một lần.
            <button class="ghost" id="newPin">Đổi mã PIN</button></p>
        </div>
      </div>
      <p class="muted" style="margin-bottom:0">Không vào được? Wi-Fi trường học/công cộng thường chặn các thiết bị kết nối với nhau.
        Khi đó hãy bật <b>điểm phát Wi-Fi</b> trên điện thoại, cho laptop kết nối vào, rồi mở lại trang này để lấy địa chỉ mới.</p>`
    : `<p class="err">Laptop chưa kết nối Wi-Fi / mạng nào.</p>`}`;
  $("#remoteToggle").onclick = () => post({ enabled: !r.enabled });
  if ($("#newPin")) $("#newPin").onclick = () => {
    if (confirm("Đổi mã PIN? Các điện thoại đã đăng nhập sẽ phải nhập mã mới.")) post({ new_pin: true });
  };
}

function bindEject() {
  $("#ejectBtn").onclick = async () => {
    const b = $("#ejectBtn"), loc = b.dataset.loc;
    if (!confirm(`${b.textContent.replace("⏏ ", "")}?\nNếu đang xử lý video trên ổ này, video đó sẽ dừng lại và được làm lại khi bạn cắm ổ vào.\nNhớ dừng các video đang phát từ ổ này.`)) return;
    b.disabled = true; b.textContent = "Đang dừng ghi và tháo ổ...";
    try {
      const r = await api("/api/storage/eject", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ location: loc }) });
      flash(r.message);
      b.hidden = true;
    } finally { b.disabled = false; b.textContent = "⏏ Tháo ổ an toàn"; await refreshLib(); }
  };
}

// ---------- Điều hướng ----------
async function refreshLib() {
  try { LIB = await api("/api/library"); } catch { return; }
  renderBanner();
}

async function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("v=")) return renderVideo(h.slice(2));
  if (h === "settings") {  // vẽ cả trang 1 lần, sau đó chỉ cập nhật tiến độ chuyển video
    const full = renderedKey !== "settings";
    renderedKey = "settings";
    return renderSettings(full);
  }
  renderedKey = null;
  if (h.startsWith("p=")) return renderPlaylist(h.slice(2));
  if (!$("#url")) { $("#view").innerHTML = formHtml(); bindForm(); }
  renderLibrary();
}

window.addEventListener("hashchange", async () => { renderedKey = null; $("#view").innerHTML = ""; await refreshLib(); route(); window.scrollTo(0, 0); });

(async () => {
  // máy chủ chưa chạy (vừa bật máy) thì chờ và thử lại
  while (true) { try { STEPS = await api("/api/steps"); break; } catch { await sleep(3000); } }
  bindEject();
  await refreshLib();
  route();
  setInterval(async () => {
    await refreshLib();
    if (!online) return;
    const h = location.hash.slice(1);
    if (reconnected) {  // vừa kết nối lại: vẽ lại trang đang xem
      reconnected = false;
      if (!STEPS.length) STEPS = await api("/api/steps");
      renderedKey = null;
      if (!h && !$("#url")) $("#view").innerHTML = "";
      return route();
    }
    // không vẽ lại trang chủ khi đang gõ link
    if (!h && document.activeElement?.id === "url") return;
    route();
  }, 2500);
})();
</script>
