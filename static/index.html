<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Video Dubbing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Phong cách: xanh dương học thuật đậm, nền sáng thoáng, nút bo tròn kiểu viên thuốc */
  :root {
    --brand:#0033a0; --brand-600:#00287d; --brand-50:#eef3fc; --brand-100:#dbe5f8; --on-brand:#fff;
    --bg:#f4f6fa; --card:#fff; --text:#141a26; --muted:#6b7280; --line:#e4e8ef;
    --accent:#0033a0; --ok:#15803d; --ok-50:#e8f5ec; --warn:#b45309; --warn-50:#fdf3e6; --danger:#c8102e; --danger-50:#fdecee;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg:0 12px 28px -8px rgba(0,35,110,.22);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand:#4f7dff; --brand-600:#3d6bf0; --brand-50:#16223d; --brand-100:#1d2c4f; --on-brand:#fff;
      --bg:#0b1120; --card:#121a2c; --text:#e7ecf5; --muted:#94a0b8; --line:#222e47;
      --accent:#7d9dff; --ok:#4ade80; --ok-50:#10291b; --warn:#f5b456; --warn-50:#2d2111; --danger:#ff6b7f; --danger-50:#341720;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 28px -8px rgba(0,0,0,.6);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }  /* để .banner / .row (display:flex) không đè thuộc tính hidden */
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1, h2, h3 { letter-spacing:-.01em; }
  h2 { font-size:18px; margin:0 0 12px; font-weight:700; }
  code { font-family:ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---------- Thanh trên cùng ---------- */
  .appbar { background:var(--brand); color:var(--on-brand); position:sticky; top:0; z-index:20;
    box-shadow:0 2px 12px rgba(0,25,80,.25); }
  @media (prefers-color-scheme: dark) { .appbar { background:#0a1f5c; } }
  .appbar .wrap { max-width:1160px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; color:#fff; margin-right:auto; }
  .brand:hover { text-decoration:none; }
  .brand .logo { width:38px; height:38px; border-radius:11px; background:#fff; color:#0033a0; display:grid; place-items:center; font-size:16px; flex:none; }
  .brand b { display:block; font-size:17px; line-height:1.2; }
  .brand small { display:block; font-size:12px; opacity:.8; }
  .appbar nav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip-link { color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:999px;
    padding:6px 14px; font-size:13px; font-weight:500; white-space:nowrap; }
  .chip-link:hover { background:rgba(255,255,255,.2); text-decoration:none; }
  .appbar button.ghost { color:#fff; border-color:rgba(255,255,255,.35); background:transparent; }
  .appbar button.ghost:hover { background:rgba(255,255,255,.14); }

  main { max-width:1160px; margin:0 auto; padding:24px 16px 72px; }

  /* ---------- Khối nội dung ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px; box-shadow:var(--shadow); }
  .section-head { display:flex; align-items:baseline; gap:10px; margin:28px 0 14px; }
  .section-head h2 { margin:0; padding-left:12px; border-left:4px solid var(--brand); line-height:1.2; }
  .section-head .count { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .err { color:var(--danger); }
  .msg { margin-left:12px; font-size:14px; }
  .back { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; font-weight:500; font-size:14px; }

  /* ---------- Ô nhập, nút ---------- */
  label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px; }
  label.check { display:flex; gap:8px; align-items:center; color:var(--text); font-size:14px; margin-top:12px; font-weight:400; }
  input, select { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); font:inherit;
    transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-100); }
  input[type=range] { padding:0; accent-color:var(--brand); border:0; box-shadow:none; }
  input[type=checkbox], input[type=radio] { width:auto; flex:none; accent-color:var(--brand); }
  button { background:var(--brand); color:#fff; border:0; border-radius:999px; padding:11px 22px; font:inherit; font-weight:600; cursor:pointer;
    transition:background .15s, transform .05s, box-shadow .15s; }
  button:hover { background:var(--brand-600); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); padding:7px 14px; font-weight:500; font-size:14px; }
  button.ghost:hover { background:var(--brand-50); border-color:var(--brand-100); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; }

  /* ---------- Khối dán link ở trang chủ ---------- */
  .hero { background:linear-gradient(135deg, var(--brand) 0%, #1a4fc4 60%, #2f6bdf 100%); color:#fff; border:0; padding:28px; position:relative; overflow:hidden; }
  @media (prefers-color-scheme: dark) { .hero { background:linear-gradient(135deg, #0a1f5c 0%, #13348f 100%); } }
  .hero::after { content:""; position:absolute; right:-80px; top:-80px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); pointer-events:none; }
  .hero h2 { font-size:24px; margin:0 0 4px; }
  .hero p { margin:0 0 18px; opacity:.85; }
  .hero .bar-input { display:flex; gap:8px; background:#fff; border-radius:999px; padding:6px; box-shadow:var(--shadow-lg); }
  .hero .bar-input input { border:0; background:transparent; color:#141a26; border-radius:999px; box-shadow:none; padding:10px 14px; }
  .hero .bar-input button { flex:none; padding:10px 22px; }
  .hero .bar-input select.target { flex:none; width:auto; border:0; border-radius:999px; background:var(--brand-50); color:var(--brand); font-weight:600; padding:10px 14px; cursor:pointer; }
  .hero label.check { color:#fff; }
  .hero .msg { color:#fff; margin:10px 0 0; display:block; }
  .hero .msg.err { color:#ffd3d9; }
  details.adv { margin-top:14px; }
  details.adv summary { cursor:pointer; font-size:14px; font-weight:500; opacity:.9; list-style:none; display:inline-flex; gap:6px; align-items:center; }
  details.adv summary::-webkit-details-marker { display:none; }
  details.adv summary::before { content:"⚙"; }
  details.adv[open] summary { margin-bottom:14px; }
  details.adv .grid { background:var(--card); color:var(--text); border-radius:14px; padding:16px; }

  /* ---------- Thư viện ---------- */
  .lib { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:18px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; color:var(--text); display:block;
    box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s; }
  .tile:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); text-decoration:none; }
  .cover { aspect-ratio:16/9; background:var(--brand-50) center/cover no-repeat; position:relative; }
  .tile .cover::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.45), transparent 45%); }
  .cover .dur { position:absolute; right:8px; bottom:8px; z-index:1; background:rgba(0,0,0,.72); color:#fff; font-size:12px; font-weight:500; padding:2px 7px; border-radius:6px; }
  .cover .stack { position:absolute; inset:auto 0 0 auto; z-index:1; margin:8px; background:rgba(0,51,160,.9); color:#fff; font-size:13px; font-weight:600;
    padding:4px 10px; border-radius:999px; }
  .cover .bar { position:absolute; left:0; right:0; bottom:0; z-index:2; border-radius:0; height:4px; background:rgba(255,255,255,.3); }
  .tile .info { padding:12px 14px 14px; }
  .tile .t { font-size:14px; font-weight:600; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
  .tile .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; }
  .empty { text-align:center; padding:40px 16px; color:var(--muted); border:2px dashed var(--line); border-radius:var(--radius); }

  /* ---------- Nhãn trạng thái, thanh tiến độ ---------- */
  .badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px;
    background:var(--bg); color:var(--muted); white-space:nowrap; }
  .badge::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.done { color:var(--ok); background:var(--ok-50); }
  .badge.error { color:var(--danger); background:var(--danger-50); }
  .badge.running { color:var(--warn); background:var(--warn-50); }
  .badge.queued { color:var(--brand); background:var(--brand-50); }
  .badge.prio { color:#b45309; background:#fdf3e6; }
  .badge.prio::before { display:none; }
  button.ghost.mini { padding:3px 10px; font-size:12px; }
  @media (prefers-color-scheme: dark) { .badge.queued { color:var(--accent); } }
  .bar { height:6px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar > div { height:100%; background:var(--brand); border-radius:inherit; transition:width .4s; }
  .bar.ok > div { background:var(--ok); }

  /* ---------- Thông báo ---------- */
  .banner { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .banner .ico { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--brand-50); flex:none; font-size:17px; }
  .banner.ok .ico { background:var(--ok-50); }
  .banner.warn .ico { background:var(--warn-50); }
  .banner .bar { margin-top:8px; max-width:420px; }
  .flash { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:50; background:#141a26; color:#fff; border-radius:999px;
    padding:12px 20px; box-shadow:var(--shadow-lg); font-size:14px; max-width:calc(100% - 32px); animation:pop .2s ease-out; }
  @keyframes pop { from { opacity:0; transform:translate(-50%, 8px); } }

  /* ---------- Tiến độ xử lý ---------- */
  .steps { display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .step { display:flex; align-items:center; gap:12px; color:var(--muted); }
  .step > span:first-child { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:13px; background:var(--bg); border:1px solid var(--line); flex:none; }
  .step.active { color:var(--text); font-weight:600; }
  .step.active > span:first-child { background:var(--brand); color:#fff; border-color:var(--brand); }
  .step.ok { color:var(--ok); }
  .step.ok > span:first-child { background:var(--ok-50); border-color:transparent; }
  .step .bar { flex:1; max-width:260px; }
  pre { background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:12px; max-height:200px; overflow:auto; font-size:12px; white-space:pre-wrap; }

  /* ---------- Trang xem video ---------- */
  video { width:100%; border-radius:12px; background:#000; display:block; }
  .watch { display:grid; grid-template-columns:1fr 330px; gap:20px; align-items:start; }
  @media (max-width: 900px) { .watch { grid-template-columns:1fr; } }
  .watch h2.title { font-size:20px; margin:14px 0 4px; }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
  .links a { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:var(--brand-50); font-size:13px; font-weight:500; }
  .links a:hover { background:var(--brand-100); text-decoration:none; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { border-top:1px solid var(--line); padding:8px 10px; vertical-align:top; }
  td.time { color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; cursor:pointer; font-weight:500; }
  tr.now td { background:var(--brand-50); }
  .seg-wrap { max-height:420px; overflow:auto; margin-top:4px; border-radius:12px; }
  .plist { max-height:600px; overflow:auto; margin:0 -8px; }
  .pitem { display:flex; gap:10px; padding:8px; border-radius:12px; color:var(--text); align-items:center; }
  .pitem:hover { background:var(--bg); text-decoration:none; }
  .pitem.cur { background:var(--brand-50); }
  .pitem .cover { width:104px; flex:none; border-radius:8px; }
  .pitem .t { font-size:13px; flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pitem .t .badge { margin-top:4px; }
  .pitem .n { color:var(--muted); font-size:12px; width:20px; text-align:right; flex:none; font-variant-numeric:tabular-nums; }
  .noplay { aspect-ratio:16/9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px;
    border-radius:12px; background:var(--brand-50); border:2px dashed var(--brand-100); }

  /* ---------- Cài đặt ---------- */
  .opt { display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; cursor:pointer;
    transition:border-color .15s, background .15s; }
  .opt:hover { border-color:var(--brand-100); }
  .opt.sel { border-color:var(--brand); background:var(--brand-50); }
  .opt.off { opacity:.65; }
  .opt input { margin-top:5px; }
  .opt .bar { margin-top:8px; max-width:360px; }
  #remoteCard svg { width:100%; height:auto; display:block; }

  /* ---------- Livestream ---------- */
  .live-embed, .live-video { position:relative; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .live-embed iframe, .live-video video { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .live-cap { margin-top:12px; padding:12px 16px; border-radius:12px; background:var(--brand-50); min-height:70px; }
  .live-cap .tr { font-size:19px; font-weight:600; line-height:1.45; }
  .live-cap .src { color:var(--muted); font-size:14px; margin-top:2px; }
  .overlay-cap { position:absolute; left:5%; right:5%; bottom:60px; text-align:center; color:#fff; pointer-events:none;
    font-size:clamp(15px, 2.4vw, 22px); font-weight:600; line-height:1.4; text-shadow:0 1px 3px #000, 0 0 10px #000; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .badge.live { color:#fff; background:#d4002a; }
  .badge.live::before { animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .show-sm { display:none; }

  @media (max-width: 560px) {
    .card { padding:16px; }
    .hero { padding:20px; }
    .hero h2 { font-size:20px; }
    .hero .bar-input { flex-direction:column; border-radius:18px; }
    .brand small, .hide-sm { display:none; }
    .show-sm { display:inline; }
    .appbar { position:static; }
    .appbar .wrap { padding:10px 14px; flex-wrap:nowrap; }
    .brand b { font-size:15px; }
    .brand .logo { width:32px; height:32px; border-radius:9px; }
    .chip-link, .appbar button.ghost { padding:5px 10px; font-size:12px; }
    .lib { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
  }
</style>
</head>
<body>
<header class="appbar"><div class="wrap">
  <a href="#" class="brand"><span class="logo">▶</span>
    <span><b id="appName">Video Dubbing</b><small id="appSub">Translate &amp; dub YouTube lectures</small></span></a>
  <nav><a href="#live" class="chip-link" id="liveLink">🔴 Live</a>
    <a href="#settings" class="chip-link" id="storageLink">💾 Storage</a>
    <button class="ghost" id="ejectBtn" hidden title="Stop writing to the drive and eject it safely">⏏ Safely eject</button>
    <button class="ghost" id="langBtn" title="中文 / English">🌐 繁中</button></nav>
</div></header>
<main>
  <div id="conn" class="banner warn" hidden><span class="ico">⚠️</span><span style="flex:1" id="connText">Lost connection to the server — reconnecting…</span>
    <button class="ghost" id="connReload" onclick="location.reload()">Reload page</button></div>
  <div id="banner"></div>
  <div id="view"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} },
                del(k) { try { localStorage.removeItem(k); } catch {} } };
let STEPS = [], LANGS = { sources:[], targets:[] }, LIB = { jobs:[], playlists:[] }, renderedKey = null;

// ---------- Ngôn ngữ giao diện: tiếng Anh / tiếng Trung phồn thể ----------
// Chuỗi trong mã viết bằng tiếng Anh; t() tra bảng ZH, {tên} là chỗ điền giá trị.
let UI = store.get("ui-lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh-TW" : "en");
const ZH = {
  "Video Dubbing": "影片配音", "Translate & dub YouTube lectures": "翻譯並配音 YouTube 課程",
  "💾 Storage": "💾 儲存位置", "Storage: {name}": "儲存位置：{name}",
  "Stop writing to the drive and eject it safely": "停止寫入並安全退出硬碟", "⏏ Safely eject": "⏏ 安全退出",
  "⏏ Eject": "⏏ 退出", "drive": "硬碟",
  "Lost connection to the server — reconnecting…": "與伺服器的連線中斷 — 正在重新連線…", "Reload page": "重新載入頁面",
  "Lost connection to the server": "與伺服器的連線中斷", "Error {code}": "錯誤 {code}", "Error: {msg}": "錯誤：{msg}",
  "Queued": "排隊中", "Processing": "處理中", "Done": "完成", "Failed": "失敗",
  "Translate & dub YouTube videos": "翻譯並配音 YouTube 影片",
  "Paste a video or playlist link in any language — it is transcribed, translated and read aloud in Vietnamese or Chinese.":
    "貼上任何語言的影片或播放清單連結 — 系統會聽寫、翻譯，並以越南語或中文朗讀。",
  "YouTube link": "YouTube 連結", "Paste a YouTube video or playlist link…": "貼上 YouTube 影片或播放清單連結…",
  "Output language": "輸出語言", "Start dubbing": "開始配音", "Translate the whole playlist": "翻譯整個播放清單",
  "Voice, translation and volume options": "語音、翻譯與音量選項", "Source language": "原始語言", "Auto-detect": "自動偵測",
  "Voice": "語音", "Female": "女聲", "Male": "男聲", "Recognition quality": "辨識品質",
  "Fast (small)": "快速（small）", "Good (large-v3-turbo)": "良好（large-v3-turbo）", "Best, slow (large-v3)": "最佳，較慢（large-v3）",
  "Translator": "翻譯工具", "Offline on this laptop (NLLB)": "本機離線翻譯（NLLB）", "Google Translate (needs internet)": "Google 翻譯（需要網路）",
  "Original audio volume:": "原始音量：", "Sign in to YouTube via": "登入 YouTube 的方式",
  "Turn on when YouTube says 'Sign in to confirm you're not a bot'": "當 YouTube 顯示「Sign in to confirm you're not a bot」時開啟",
  "Don't use": "不使用", "Firefox (sign in to YouTube in Firefox first)": "Firefox（需先在 Firefox 登入 YouTube）",
  "Reading the playlist...": "正在讀取播放清單…",
  "Updated the existing playlist: {n} videos added to the queue.": "已更新現有播放清單：{n} 部影片加入佇列。",
  "This playlist already has all its videos.": "此播放清單的影片都已加入。",
  "This video was already dubbed — opening the saved copy.": "此影片之前已配音 — 開啟已儲存的版本。",
  "Remove priority": "取消優先", "Dub this right after the current video": "目前的影片完成後立刻配音這部",

function fmt(t) {
  t = Math.floor(t || 0);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}

let online = true, reconnected = false;
function setOnline(ok) {
  if (ok === online) return;
  online = ok;
  $("#conn").hidden = ok;
  if (ok) reconnected = true;  // lần làm mới kế tiếp sẽ vẽ lại trang đang xem
}
const offlineError = () => Object.assign(new Error(t("Lost connection to the server")), { offline: true });
const api = async (url, opts) => {
  let r;
  try { r = await fetch(url, opts); } catch { setOnline(false); throw offlineError(); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status >= 500 && !j.error) { setOnline(false); throw offlineError(); }
  setOnline(true);
  if (!r.ok) throw Object.assign(new Error(sv(j.error) || t("Error {code}", { code: r.status })), { status: r.status });
  return j;
};

        <select id="voice"><option value="female">${t("Female")}</option><option value="male">${t("Male")}</option></select></div>
      <div><label for="model">${t("Recognition quality")}</label>
        <select id="model"><option value="small">${t("Fast (small)")}</option><option value="large-v3-turbo" selected>${t("Good (large-v3-turbo)")}</option><option value="large-v3">${t("Best, slow (large-v3)")}</option></select></div>
      <div><label for="translator">${t("Translator")}</label>
        <select id="translator"><option value="offline">${t("Offline on this laptop (NLLB)")}</option><option value="google">${t("Google Translate (needs internet)")}</option></select></div>
      <div><label for="bg">${t("Original audio volume:")} <span id="bgv">25%</span></label>
        <input id="bg" type="range" min="0" max="100" value="25"></div>
      <div><label for="cookies" title="${t("Turn on when YouTube says 'Sign in to confirm you're not a bot'")}">${t("Sign in to YouTube via")}</label>
        <select id="cookies"><option value="none">${t("Don't use")}</option><option value="firefox">${t("Firefox (sign in to YouTube in Firefox first)")}</option><option value="chrome">Chrome</option></select></div>
    </div></details>
  </div>
  <div id="lib"></div>`;
}

function bindForm() {
  // nhớ lựa chọn lần trước
  for (const id of ["language","target","voice","model","translator","bg","cookies"]) {
    const v = store.get("opt:" + id); if (v !== null && [...($("#" + id).options || [v])].some(o => (o.value ?? o) === v)) $("#" + id).value = v;
    $("#" + id).addEventListener("change", e => store.set("opt:" + id, e.target.value));
  }
  // tên giọng đọc theo ngôn ngữ đầu ra (vd. Female – HoaiMy / Female – Xiaoxiao)
  const voiceNames = () => {
    const tg = LANGS.targets.find(x => x.id === $("#target").value);
    for (const o of $("#voice").options) {
      const v = tg?.voices[o.value] || "";
      o.textContent = t(o.value === "female" ? "Female" : "Male") + (v ? " – " + v.split("-")[2].replace("Neural", "") : "");
    }
  };
  voiceNames(); $("#target").addEventListener("change", voiceNames);
  $("#bgv").textContent = $("#bg").value + "%";
  $("#bg").oninput = e => $("#bgv").textContent = e.target.value + "%";
  $("#url").oninput = e => $("#plWrap").hidden = !e.target.value.includes("list=");
  $("#go").onclick = async () => {
    const msg = $("#msg"), btn = $("#go");
    const isPl = $("#url").value.includes("list=") && $("#pl").checked;
    msg.className = "msg"; msg.textContent = isPl ? t("Reading the playlist...") : "";
    btn.disabled = true;
    try {
      const r = await api("/api/jobs", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
        url: $("#url").value, playlist: isPl, language: $("#language").value, target: $("#target").value, voice: $("#voice").value,
        model: $("#model").value, translator: $("#translator").value, bg_volume: $("#bg").value / 100,
        cookies: $("#cookies").value }) });
      $("#url").value = ""; $("#plWrap").hidden = true;
      if (r.playlist) {
        location.hash = "p=" + r.playlist.id;
        if (r.updated) setTimeout(() => flash(r.added ? t("Updated the existing playlist: {n} videos added to the queue.", { n: r.added }) : t("This playlist already has all its videos.")), 300);
      } else {
        location.hash = "v=" + r.job.id;
        if (r.existing) setTimeout(() => flash(t("This video was already dubbed — opening the saved copy.")), 300);
      }
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    btn.disabled = false;
  };
}

function flash(text) {
  document.querySelectorAll(".flash").forEach(e => e.remove());
  const el = document.createElement("div");
  el.className = "flash"; el.textContent = text;
  document.body.append(el); setTimeout(() => el.remove(), 6000);
}

// vị trí trong hàng đợi (1 = làm tiếp theo) và nút ưu tiên
const queuePos = id => (LIB.order || []).indexOf(id) + 1;
const prioBtn = (j, mini) => `<button class="ghost prio-btn ${mini ? "mini" : ""}" data-id="${j.id}" data-on="${j.priority ? 0 : 1}"
  title="${t(j.priority ? "Remove priority" : "Dub this right after the current video")}">${t(j.priority ? "✕ Unprioritize" : "⚡ Dub next")}</button>`;

function tile(j) {
  const bar = j.status === "running" ? `<div class="bar"><div style="width:${progressOf(j)*100}%"></div></div>` : "";
  return `<a class="tile" href="#v=${j.id}">
    <div class="cover" style="background-image:url('${coverUrl(j)}')">${j.duration ? `<span class="dur">${fmt(j.duration)}</span>` : ""}${bar}</div>
    <div class="info"><div class="t">${esc(j.title)}</div>
      <div class="meta"><span class="badge ${j.status}">${statusName(j.status)}${j.status === "queued" && queuePos(j.id) ? " #" + queuePos(j.id) : ""}</span>${
        j.status === "queued" ? (j.priority ? `<span class="badge prio">${t("⚡ Priority")}</span>` : "") + prioBtn(j, true) : ""}${
        j.status === "done" && !j.video_ok ? `<span class="muted" title="${t("The video is on {place}", { place: esc(sv(j.video_place)) })}">${t("🔌 Plug in drive")}</span>` : resumeLabel(j)}</div></div></a>`;
}

function resumeLabel(j) {
  const p = +store.get("pos:" + j.id);
  return p > 5 ? `<span class="muted">${t("Watched {time}", { time: fmt(p) })}</span>` : "";
}

// "Japanese → Vietnamese" (ngôn ngữ gốc chỉ biết sau bước nhận dạng giọng nói)
function langLine(j) {
  const src = j.source_lang || (j.language !== "auto" ? j.language : null);
  return `🌐 ${src ? esc(sourceName(src)) : t("Auto-detect")} → ${esc(targetName(j.target || "vi"))}`;
}

function progressOf(j) {
  const i = STEPS.findIndex(s => s.id === j.step);
  return i < 0 ? 0 : (i + (j.progress || 0)) / STEPS.length;
}

function renderLibrary() {
  const el = $("#lib"); if (!el) return;
  const inPl = new Set(LIB.playlists.flatMap(p => p.job_ids));
  const singles = LIB.jobs.filter(j => !inPl.has(j.id));
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  let html = "";
  if (LIB.playlists.length) {
    html += `<div class="section-head"><h2>${t("Playlists")}</h2><span class="count">${LIB.playlists.length}</span></div>
      <div class="lib">${LIB.playlists.map(p => {
      const first = byId[p.job_ids.find(id => byId[id]?.status === "done")] || byId[p.job_ids[0]] || {};
      return `<a class="tile" href="#p=${p.id}">
        <div class="cover" style="background-image:url('${first.id ? coverUrl(first) : ""}')"><span class="stack">☰ ${t("{n} videos", { n: p.total })}</span></div>
        <div class="info"><div class="t">${esc(p.title)}</div>
          <div class="bar ok" style="margin-top:10px"><div style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div>
          <div class="meta"><span class="muted">${t("{done}/{total} done", p)}</span>${p.failed ? `<span class="badge error">${t("{n} failed", { n: p.failed })}</span>` : ""}</div></div></a>`;
    }).join("")}</div>`;
  }
  html += `<div class="section-head"><h2>${t("Videos")}</h2><span class="count">${singles.length || ""}</span></div>
    ${singles.length ? `<div class="lib">${singles.map(tile).join("")}</div>` : `<div class="empty">${t("No single videos yet — paste a YouTube link above to get started.")}</div>`}`;
  el.innerHTML = html;
}

function renderBanner() {
  if (LIB.storage) $("#storageLink").innerHTML = `💾 <span class="hide-sm">${t("Storage: {name}", { name: esc(sv(LIB.storage)) })}</span>`;
  const eb = $("#ejectBtn"), drive = (LIB.ejectable || [])[0];
  if (!eb.disabled) {
    eb.hidden = !drive;
    if (drive) {
      eb.innerHTML = `${t("⏏ Eject")} <span class="hide-sm">${esc(sv(drive.name))}</span><span class="show-sm">${t("drive")}</span>`;
      eb.dataset.loc = drive.id; eb.dataset.name = sv(drive.name);
    }
  }
  const ejected = (LIB.ejecting || []).map(d => `<div class="banner ok"><span class="ico">✅</span>
      <span style="flex:1"><b>${t("{name} was safely ejected — you can unplug it now.", { name: esc(sv(d.name)) })}</b>
        <br><span class="muted">${t("Plug it back in to keep using it.")}</span></span>
      <button class="ghost resume-drive" data-loc="${esc(d.id)}">${t("Use the drive again")}</button></div>`).join("");
  const cur = LIB.jobs.find(j => j.id === LIB.current);
  $("#banner").innerHTML = ejected + (cur ? `<div class="banner ${LIB.paused_until ? "warn" : ""}">
      <span class="ico">${LIB.paused_until ? "⏸" : "⏳"}</span>
      <span style="flex:1;min-width:0">${t("Processing:")} <a href="#v=${cur.id}"><b>${esc(cur.title)}</b></a>
      ${LIB.queued ? t(" — <b>{n}</b> more in queue", { n: LIB.queued }) : ""}
      ${!LIB.paused_until ? `<div class="bar"><div style="width:${progressOf(cur) * 100}%"></div></div>` : ""}
      ${LIB.paused_until ? `<br><span class="err">${t("{reason} — retrying automatically at {time}.", { reason: esc(sv(LIB.pause_reason)), time: timeStr(new Date(LIB.paused_until * 1000)) })}
        ${LIB.pause_reason?.includes("YouTube") ? esc(t("If it stays blocked, sign in to YouTube in Firefox and choose \"Sign in to YouTube via: Firefox\".")) : ""}</span>` : ""}
      <br><span class="muted">${t("The laptop won't sleep until the queue is done. You can close the browser, but don't shut down.")}</span></span>
    </div>` : "");
  document.querySelectorAll(".resume-drive").forEach(b => b.onclick = async () => {
    await api("/api/storage/resume", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ location: b.dataset.loc }) });
    await refreshLib();
  });
}

// ---------- Trang playlist ----------
function renderPlaylist(id) {
  const p = LIB.playlists.find(p => p.id === id);
  if (!p) { $("#view").innerHTML = `<a class="back" href="#">${t("← Library")}</a><p>${t("Playlist not found.")}</p>`; return; }
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  const queuedIn = p.job_ids.map(x => byId[x]).filter(j => j?.status === "queued"), allPrio = queuedIn.every(j => j.priority);
  const emptyTile = (e, i) => `<div class="tile" style="opacity:.75;cursor:default">
    <div class="cover" style="background-image:url('${e.video_id ? `https://i.ytimg.com/vi/${e.video_id}/mqdefault.jpg` : ""}');filter:grayscale(1)"></div>
    <div class="info"><div class="t">${esc(e.title || t("Deleted video"))}</div>
      <div class="row" style="margin-top:6px"><span class="badge">${t("Deleted")}</span>
        <button class="ghost redo-slot" data-i="${i}">${t("Dub again")}</button></div></div></div>`;
  $("#view").innerHTML = `<a class="back" href="#">${t("← Library")}</a>
    <div class="card"><div class="row"><h2 style="margin:0">${esc(p.title)}</h2>
      <span><a class="muted" href="${esc(p.url)}" target="_blank">${t("Open on YouTube")}</a>
        <button class="ghost" id="syncPl" title="${t("Add new videos, re-dub deleted ones and retry failed ones")}">${t("Update from YouTube")}</button>
        <button class="ghost" id="delPl">${t("Delete playlist")}</button></span></div>
      <p class="muted">${t("{done}/{total} videos dubbed", p)}${p.settings?.target && p.settings.target !== "vi" ? t(" into {lang}", { lang: esc(targetName(p.settings.target)) }) : ""}${p.failed ? ` · <span class="err">${t("{n} failed", { n: p.failed })}</span>` : ""}${p.missing ? " · " + t("{n} deleted", { n: p.missing }) : ""}
        ${p.failed ? ` <button class="ghost" id="retryPl">${t("Retry failed videos")}</button>` : ""}
        ${queuedIn.length ? ` <button class="ghost" id="prioPl" data-on="${allPrio ? 0 : 1}">${allPrio ? t("✕ Unprioritize playlist") : t("⚡ Dub this playlist next ({n})", { n: queuedIn.length })}</button>` : ""}</p>
      <div class="bar ok"><div style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div></div>
    <div class="lib">${p.entries.map((e, i) => byId[e.job_id] ? tile(byId[e.job_id]) : emptyTile(e, i)).join("")}</div>`;
  $("#delPl").onclick = async () => {
    if (!confirm(t("Delete this playlist and all of its dubbed videos?"))) return;
    await api("/api/playlists/" + id, { method:"DELETE" });
    location.hash = "";
  };
  $("#syncPl").onclick = async e => {
    e.target.disabled = true; e.target.textContent = t("Reading playlist...");
    try {
      const r = await api(`/api/playlists/${id}/sync`, { method:"POST" });
      flash(r.added ? t("Added {n} videos to the queue.", { n: r.added }) : t("The playlist is complete, nothing new."));
    } finally { await refreshLib(); renderPlaylist(id); }
  };
  if ($("#prioPl")) $("#prioPl").onclick = async e => {
    const on = e.target.dataset.on === "1";
    e.target.disabled = true;
    const r = await api(`/api/playlists/${id}/priority`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ on }) });
    flash(on ? t("{n} videos from this playlist will be dubbed right after the current video.", { n: r.count }) : t("Priority removed."));
    await refreshLib(); renderPlaylist(id);
  };
  if ($("#retryPl")) $("#retryPl").onclick = async () => {
    const r = await api(`/api/playlists/${id}/retry-failed`, { method:"POST" });
    flash(t("Queued {n} failed videos again.", { n: r.count }));
    await refreshLib(); renderPlaylist(id);
  };
  document.querySelectorAll(".redo-slot").forEach(b => b.onclick = async () => {
    b.disabled = true;
    await api(`/api/playlists/${id}/slots/${b.dataset.i}`, { method:"POST" });
    await refreshLib(); renderPlaylist(id);
  });
}

// ---------- Trang xem / tiến độ một video ----------
async function renderVideo(id) {
  let j;
  const drawn = renderedKey?.startsWith(id + ":");  // đã vẽ rồi thì chỉ cần trạng thái, không tải lại lời thoại
  try { j = await api(`/api/jobs/${id}${drawn ? "?segments=0" : ""}`); } catch (e) {
    // mất kết nối thì giữ nguyên trang, tự thử lại ở lần làm mới sau
    if (!e.offline) $("#view").innerHTML = `<a class="back" href="#">${t("← Library")}</a><p>${t("Video not found (it may have been deleted).")}</p>`;
    return;
  }
  if (location.hash !== "#v=" + id) return;
  const pl = LIB.playlists.find(p => p.job_ids.includes(id));
  const back = pl ? `<a class="back" href="#p=${pl.id}">← ${esc(pl.title)}</a>` : `<a class="back" href="#">${t("← Library")}</a>`;
  const key = [id, j.status, j.video_ok, j.local_copy].join(":"), target = j.target || "vi";

  if (j.status === "done") {
    if (renderedKey === key) { renderSide(pl, id); return; }
    if (!j.segments) { renderedKey = null; return renderVideo(id); }  // vừa xong: tải kèm lời thoại để vẽ
    renderedKey = key;
    $("#view").innerHTML = `${back}
      <div class="watch"><div>
        <div class="card">
          ${j.video_ok
            ? `<video id="player" controls autoplay src="/files/${id}/dubbed.mp4"><track kind="subtitles" srclang="${target.startsWith("zh") ? "zh" : "vi"}" label="${esc(targetName(target))}" default></video>`
            : `<div class="noplay"><div style="font-size:36px">🔌</div>
                 <b>${t("The video is on {place}", { place: esc(sv(j.video_place)) })}</b>
                 <span class="muted">${t("Plug the drive in to watch — the video opens automatically once the drive is detected. The bilingual transcript below is still available.")}</span></div>`}
          <div class="row" style="margin-top:10px"><h2 style="margin:0">${esc(j.title)}</h2>
            <span><button class="ghost" id="redo">${t("Redo")}</button> <button class="ghost" id="del">${t("Delete")}</button></span></div>
          <p class="muted" style="margin:6px 0 0">${langLine(j)} · ${t("💾 Stored on: {place}", { place: esc(sv(j.video_place)) })}${j.local_copy ? t(" · copy on laptop") : ""}
            ${j.video_at && j.video_at !== "local" && (j.video_ok || j.local_copy)
              ? ` <button class="ghost" id="keep">${t(j.local_copy ? "Remove laptop copy" : "Keep on laptop (watch without the drive)")}</button>` : ""}</p>
          <p class="links" style="margin-bottom:0">
            ${j.video_ok ? `<a href="/files/${id}/dubbed.mp4?dl=1">${t("⬇ Dubbed video")}</a>` : ""}
            <a href="/files/${id}/vi.srt?dl=1">${t("⬇ {lang} subtitles", { lang: esc(targetName(target)) })}</a>
            <a href="/files/${id}/original.srt?dl=1">${t("⬇ Original subtitles")}</a>
            <a href="${esc(j.url)}" target="_blank">↗ YouTube</a></p>
        </div>
        <div class="card"><h2>${t("Bilingual transcript")}</h2><div class="seg-wrap" id="segs"><table>${(j.segments || []).map((s, i) => `
          <tr data-i="${i}"><td class="time" data-t="${s.start}">${fmt(s.start)}</td><td>${esc(s.text)}</td><td>${esc(s.vi)}</td></tr>`).join("")}
        </table></div></div>
      </div><div id="side"></div></div>`;
    if (j.video_ok) setupPlayer(j, pl);
    renderSide(pl, id);
    if ($("#keep")) $("#keep").onclick = async e => {
      e.target.disabled = true; e.target.textContent = t(j.local_copy ? "Removing..." : "Copying to laptop...");
      try { await api(`/api/jobs/${id}/keep-local`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ keep: !j.local_copy }) }); }
      finally { renderedKey = null; renderVideo(id); }
    };
    $("#del").onclick = async () => {
      if (!confirm(t("Delete this video?"))) return;
      await api("/api/jobs/" + id, { method:"DELETE" });
      location.hash = pl ? "p=" + pl.id : "";
    };
    $("#redo").onclick = async () => {
      if (!confirm(t("Dub this video again with the same settings? (the current copy is kept)"))) return;
      const r = await api("/api/jobs", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ url: j.url, force: true, voice: j.voice, language: j.language, target, model: j.model, translator: j.translator, bg_volume: j.bg_volume, cookies: j.cookies }) });
      location.hash = "v=" + r.job.id;
    };
    return;
  }

  renderedKey = key;
  const idx = STEPS.findIndex(s => s.id === j.step);
  $("#view").innerHTML = `${back}<div class="card">
    <div class="row"><h2 style="margin:0">${esc(j.title)}</h2><span class="badge ${j.status}">${statusName(j.status)}</span></div>
    ${j.status === "queued" ? `<p class="muted">${queuePos(id) === 1 ? t("<b>Next up</b>") : queuePos(id) ? t("<b>#{n}</b> in the queue", { n: queuePos(id) }) : t("Waiting in the queue")}
      ${t("— videos are processed one at a time.")} ${j.priority ? `<span class="badge prio">${t("⚡ Priority")}</span> ` : ""}${prioBtn(j)}</p>` : ""}
    <p class="muted" style="margin:6px 0 0">${langLine(j)}</p>
    <div class="steps">${STEPS.map((s, i) => {
      const cls = j.status === "error" && i === idx ? "" : i < idx ? "ok" : i === idx ? "active" : "";
      const mark = i < idx ? "✓" : i === idx ? (j.status === "error" ? "✗" : "●") : "○";
      const bar = i === idx && j.status === "running" ? `<div class="bar"><div style="width:${j.progress*100}%"></div></div>` : "";
      return `<div class="step ${cls}"><span>${mark}</span><span>${stepName(s)}</span>${bar}</div>`;
    }).join("")}</div>
    ${j.error ? `<p class="err">${t("Error: {msg}", { msg: esc(sv(j.error)) })}</p>` : ""}
    <pre>${esc(j.logs.map(l => l.replace(/^(\[[\d:]+\] )?(.*)$/s, (_, ts, m) => (ts || "") + sv(m))).join("\n")) || t("Waiting...")}</pre>
    ${j.status === "error" ? `<button id="retry">${t("Retry")}</button> ` : ""}
    ${j.status !== "running" ? `<button class="ghost" id="del">${t(j.status === "queued" ? "Cancel" : "Delete")}</button>` : ""}
  </div>`;
  if ($("#retry")) $("#retry").onclick = async () => { await api(`/api/jobs/${id}/retry`, { method:"POST" }); renderedKey = null; };
  if ($("#del")) $("#del").onclick = async () => { await api("/api/jobs/" + id, { method:"DELETE" }); location.hash = pl ? "p=" + pl.id : ""; };
}

function renderSide(pl, id) {
  const side = $("#side"); if (!side) return;
  if (!pl) { side.remove(); $(".watch").style.gridTemplateColumns = "1fr"; return; }
  const byId = Object.fromEntries(LIB.jobs.map(j => [j.id, j]));
  side.innerHTML = `<div class="card"><h2>${esc(pl.title)}</h2><p class="muted">${t("{done}/{total} done", pl)}</p>
    <div class="plist">${pl.entries.map((e, n) => { const jid = e.job_id, j = byId[jid];
      if (!j) return `<div class="pitem" style="opacity:.6"><span class="n">${n + 1}</span><div class="t">${esc(e.title || "")}<br><span class="badge">${t("Deleted")}</span></div></div>`;
      return `<a class="pitem ${jid === id ? "cur" : ""}" href="#v=${jid}"><span class="n">${n + 1}</span>
        <div class="cover" style="background-image:url('${coverUrl(j)}')"></div>
        <div class="t">${esc(j.title)}<br><span class="badge ${j.status}">${statusName(j.status)}</span></div></a>`; }).join("")}</div></div>`;
  side.querySelector(".cur")?.scrollIntoView({ block:"nearest" });
}

function setupPlayer(j, pl) {
  const v = $("#player"), id = j.id;
  // trình duyệt chỉ đọc phụ đề dạng VTT
  (async function loadTrack(tries = 0) {
    try {
      const r = await fetch(`/files/${id}/vi.srt`);
      if (!r.ok) throw 0;
      const srt = await r.text();
      v.querySelector("track").src = URL.createObjectURL(new Blob(["WEBVTT\n\n" + srt.replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2")], { type:"text/vtt" }));
    } catch { if (tries < 20 && document.body.contains(v)) setTimeout(() => loadTrack(tries + 1), 3000); }
  })();
  const saved = +store.get("pos:" + id);
  v.addEventListener("loadedmetadata", () => { if (saved > 5 && saved < v.duration - 5) v.currentTime = saved; }, { once:true });

  // video lỗi hoặc đứng hình quá lâu (mạng chập chờn, máy chủ khởi động lại) -> tự tải lại tại đúng chỗ đang xem
  let retries = 0, stallTimer = null, lastGood = 0;
  const note = document.createElement("p");
  note.className = "muted"; note.hidden = true;
  v.after(note);
  const reloadVideo = reason => {
    clearTimeout(stallTimer);
    if (!document.body.contains(v)) return;
    const t = v.currentTime || lastGood || saved || 0, wasPaused = v.paused && retries === 0 && reason === "stall";
    const wait = Math.min(2000 * 2 ** retries++, 30000);
    note.hidden = false; note.textContent = "⚠️ " + t("{reason} — reloading in {s} s…", { reason: t(reason === "stall" ? "Video stalled" : "Video failed to load"), s: wait / 1000 });
    setTimeout(() => {
      if (!document.body.contains(v)) return;
      v.src = `/files/${id}/dubbed.mp4?r=${Date.now()}`;
      v.addEventListener("loadedmetadata", () => { v.currentTime = t; if (!wasPaused) v.play().catch(() => {}); }, { once:true });
      v.load();
    }, wait);
  };
  v.addEventListener("error", () => reloadVideo("error"));
  v.addEventListener("waiting", () => { clearTimeout(stallTimer); stallTimer = setTimeout(() => !v.paused && reloadVideo("stall"), 15000); });
  v.addEventListener("playing", () => { clearTimeout(stallTimer); retries = 0; note.hidden = true; });
  v.addEventListener("pause", () => clearTimeout(stallTimer));
  v.addEventListener("timeupdate", () => { if (v.currentTime > 0) lastGood = v.currentTime; });
  let last = 0, curRow = null;
  v.addEventListener("timeupdate", () => {
    if (Math.abs(v.currentTime - last) > 3) { last = v.currentTime; store.set("pos:" + id, v.currentTime); }
    const segs = j.segments || [];
    let i = segs.findIndex((s, k) => v.currentTime >= s.start && v.currentTime < (segs[k + 1]?.start ?? Infinity));
    const row = document.querySelector(`#segs tr[data-i="${i}"]`);
    if (row !== curRow) { curRow?.classList.remove("now"); row?.classList.add("now"); curRow = row;
      if (row) { const w = $("#segs"); w.scrollTop = row.offsetTop - w.clientHeight / 3; } }
  });
  v.addEventListener("ended", () => {
    store.del("pos:" + id);
    if (!pl) return;
    const byId = Object.fromEntries(LIB.jobs.map(x => [x.id, x]));
    const next = pl.job_ids.slice(pl.job_ids.indexOf(id) + 1).find(x => byId[x]?.status === "done");
    if (next) location.hash = "v=" + next;  // tự chuyển sang video tiếp theo
  });
  document.querySelectorAll("#segs td.time").forEach(td => td.onclick = () => { v.currentTime = +td.dataset.t; v.play(); });
}

const LIVE = { id: null, lines: [], shown: 0, epoch0: 0, hls: null, key: null, form: false, tab: store.get("live-tab") || "subs" };
const LIVE_BADGE = { connecting: ["queued", "Connecting…"], live: ["live", "LIVE"], ended: ["done", "Ended"],
                     stopped: ["", "Stopped"], error: ["error", "Failed"] };
const liveBusy = s => s && ["connecting", "live"].includes(s.status);

function stopLivePlayer() {
  LIVE.hls?.destroy(); LIVE.hls = null;
}

async function renderLive() {
  let r;
  try { r = await api(`/api/live?id=${LIVE.id || ""}&since=${LIVE.lines.length}`); } catch { return; }
  if (location.hash !== "#live") return;
  const s = r.session;
  if (!s || (LIVE.form && !liveBusy(s))) return renderLiveForm();
  LIVE.form = false;
  if (s.id !== LIVE.id) { LIVE.id = s.id; LIVE.lines = []; stopLivePlayer(); }
  LIVE.lines.push(...s.lines);
  LIVE.epoch0 = s.epoch0;
  // vẽ lại cả trang chỉ khi đổi phiên / đổi tab / bắt đầu có video lồng tiếng; còn lại chỉ cập nhật chữ
  const key = [s.id, LIVE.tab, liveBusy(s), LIVE.tab === "dub" && s.segments > 0, UI].join(":");
  if (key !== LIVE.key) { LIVE.key = key; drawLive(s); }
  updateLive(s, r.queue_paused);
}

function appendLiveLines(lines, reset) {
  const box = $("#liveLines"); if (!box) return;
  const nearBottom = reset || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const rows = lines.map(l => `<tr><td class="time">${fmt(l.start)}</td><td>${esc(l.text)}</td><td>${esc(l.tr)}</td></tr>`).join("");
  const table = box.querySelector("table");
  if (reset) table.innerHTML = rows; else table.insertAdjacentHTML("beforeend", rows);
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function updateLive(s, queuePaused) {
  if (!$("#liveBadge")) return;
  const [cls, label] = LIVE_BADGE[s.status] || ["", s.status];
  $("#liveBadge").className = "badge " + cls; $("#liveBadge").textContent = t(label);
  const src = s.lang ? sourceName(s.lang) : t("Detecting language…");
  $("#liveInfo").innerHTML = `🌐 ${esc(src)} → ${esc(targetName(s.target))}` +
    (s.lag != null ? " · " + t("each {chunk} s segment takes {lag} s to process", { chunk: s.chunk, lag: s.lag }) : "");
  const notes = [];
  if (s.error) notes.push(`<span class="err">${esc(t("Error: {msg}", { msg: sv(s.error) }))}</span>`);
  if (liveBusy(s) && queuePaused) notes.push(t("⏸ The dubbing queue is paused and resumes after the livestream."));
  if (s.vod === "waiting") notes.push(t("The stream has ended. Waiting for YouTube to finish the recording, then it will be dubbed automatically."));
  if (s.vod === "queued") notes.push(t("✅ The full recording was added to the queue and will be dubbed next."));
  if (s.vod === "gave_up") notes.push(t("The recording was not available within 6 hours — paste the link on the home page later."));
  if (s.status === "stopped" && s.dub_after) notes.push(t("Stopped. To dub the full recording, paste the link on the home page after the stream ends."));
  $("#liveNote").innerHTML = notes.map(n => `<span class="muted">${n}</span>`).join("<br>");
  // dòng mới: thêm vào bảng; phụ đề ở tab "Live subtitles" là câu mới nhất
  appendLiveLines(LIVE.lines.slice(LIVE.shown), false);
  LIVE.shown = LIVE.lines.length;
  const last = LIVE.lines[LIVE.lines.length - 1];
  if ($("#capTr")) { $("#capTr").textContent = last ? last.tr : t("Waiting for speech…"); $("#capSrc").textContent = last ? last.text : ""; }
}

function loadHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";
    sc.onload = ok; sc.onerror = fail; document.head.append(sc);
  });
}

async function setupLivePlayer(s) {
  const v = $("#livePlayer"), src = `/live/${s.id}/live.m3u8`;
  if (window.MediaSource || !v.canPlayType("application/vnd.apple.mpegurl")) {
    try { await loadHls(); } catch { $("#dubNote").textContent = t("Could not load the video player (needs internet)."); return; }
    if (!document.body.contains(v)) return;
    LIVE.hls = new Hls({ liveSyncDuration: 20, liveMaxLatencyDuration: 90 });
    LIVE.hls.loadSource(src); LIVE.hls.attachMedia(v);
  } else {
    v.src = src;  // Safari trên iPhone phát HLS sẵn
  }
  v.play().catch(() => {});
  // phụ đề khớp hình: đổi vị trí đang phát ra trục thời gian chung của phiên (giây tính từ đầu phiên)
  const timeline = () => {
    const d = LIVE.hls?.playingDate || (v.getStartDate && !isNaN(v.getStartDate()) ? new Date(v.getStartDate().getTime() + v.currentTime * 1000) : null);
    return d ? d.getTime() / 1000 - LIVE.epoch0 : v.currentTime;
  };
  v.addEventListener("timeupdate", () => {
    const tl = timeline(), line = LIVE.lines.find(l => tl >= l.start && tl < l.end + 0.6);
    $("#dubCap").textContent = line ? line.tr : "";
  });
}

    if (!online) return;
    const h = location.hash.slice(1);
    if (reconnected) {  // vừa kết nối lại: vẽ lại trang đang xem
      reconnected = false;
      if (!STEPS.length) STEPS = await api("/api/steps");
      renderedKey = null;
      if (!h && !$("#url")) $("#view").innerHTML = "";
      return route();
    }
    // không vẽ lại trang chủ khi đang gõ link
    if (!h && document.activeElement?.id === "url") return;
    route();
  }, 2500);
})();
</script>
</body>
</html>
